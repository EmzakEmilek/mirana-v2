<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<title>MIRANA HUD — living core v4</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  /* Pozadie je priehľadné (OBS Browser Source). Tmavé je len v bežnom prehliadači na test —
     trieda "preview" sa pridá, keď stránka nebeží v OBS (OBS má window.obsstudio). */
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: transparent;
    font-family: 'Share Tech Mono', monospace;
    overflow: hidden;
  }
  html.preview, html.preview body { background: #0a0a0c; }
  :root {
    --yellow: #FCEE0A;
    --cyan: #00F0FF;
    --red: #FF003C;
    --dim: rgba(255,255,255,.38);
    --panel-bg: rgba(0,0,0,0.62);
    --accent: var(--yellow);
  }

  .hud { position: relative; width: 100%; height: 100vh; }

  /* Režim "fit": zdroj v OBS má tvar panela (napr. 1000x160) -> panel vyplní celý zdroj
     a v OBS sa dá ťahať za rohy ako obrázok. Pri zdroji na celú obrazovku ostáva dole v strede. */
  html.fit .panel {
    left: 50%; top: 50%; bottom: auto; width: 980px;
    --base: translate(-50%, -50%) scale(var(--fit, 1));
  }

  /* ==================================================================
     HLAVNÝ PANEL — dole na stred. Vľavo jadro (canvas), vpravo text.
     Farba akcentu sa mení so stavom (idle tlmená, listening cyan,
     processing/speaking žltá, combat červená).
     ================================================================== */
  .panel {
    position: absolute; left: 50%; bottom: 22px;
    --base: translateX(-50%);    /* zakladny posun; glitch animacia sa k nemu len pripocita */
    transform: var(--base);
    width: min(78vw, 980px); height: 150px; box-sizing: border-box;
    display: grid; grid-template-columns: 116px 1fr; gap: 0 20px; align-items: center;
    padding: 12px 26px 14px 12px;
    background: var(--panel-bg);
    backdrop-filter: blur(3px);
    border: 1px solid color-mix(in srgb, var(--accent) 45%, transparent);
    clip-path: polygon(0 0, calc(100% - 16px) 0, 100% 16px, 100% 100%, 16px 100%, 0 calc(100% - 16px));
    transition: border-color .4s;
  }
  .panel::before {              /* rohový štítok */
    content: ""; position: absolute; top: 0; right: 0; width: 16px; height: 16px;
    background: var(--accent); clip-path: polygon(100% 0, 0 0, 100% 100%); opacity: .9;
    transition: background .4s;
  }
  .panel::after {               /* tenká spodná linka, ktorá "dýcha" s jadrom */
    content: ""; position: absolute; left: 16px; right: 0; bottom: 0; height: 1px;
    background: linear-gradient(90deg, var(--accent), transparent 70%);
    opacity: var(--breath, .5); transition: background .4s;
  }
  .panel.offline { --accent: var(--dim); }
  .panel.muted   { --accent: var(--red); }
  .panel.idle       { --accent: rgba(252,238,10,.55); }
  .panel.listening  { --accent: var(--cyan); }
  .panel.processing { --accent: var(--yellow); }
  .panel.speaking   { --accent: var(--yellow); }
  .panel.combat     { --accent: var(--red); }

  canvas#core { width: 116px; height: 116px; display: block; margin: 0 auto; }

  .text { min-width: 0; height: 126px; display: flex; flex-direction: column; }
  .head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 4px; }
  .status {
    font-family: 'Rajdhani', sans-serif; font-weight: 600; font-size: 12px;
    letter-spacing: 3px; text-transform: uppercase; color: var(--accent);
    display: inline-flex; align-items: center; gap: 8px; transition: color .3s;
  }
  .status .dot { width: 6px; height: 6px; background: currentColor; border-radius: 1px; }
  .panel.processing .status .dot { animation: blink .5s steps(1) infinite; }
  .panel.speaking   .status .dot { animation: pulse .35s infinite; }
  .panel.listening  .status .dot { animation: pulse 1.1s infinite; }
  @keyframes blink { 50% { opacity: .1; } }
  @keyframes pulse { 50% { opacity: .3; } }

  .telemetry {                  /* lokácia · quest — len keď prídu dáta (Fáza 4) */
    font-family: 'Rajdhani', sans-serif; font-weight: 500; font-size: 12px;
    letter-spacing: 1.5px; text-transform: uppercase; color: var(--dim);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 55%;
  }
  .telemetry:empty { display: none; }
  .telemetry b { color: var(--cyan); font-weight: 500; }

  .sub {                        /* filler / systémová hláška — biela, oddelená od žltej odpovede */
    font-size: 14px; color: #fff; min-height: 18px; letter-spacing: .4px;
    font-style: italic; margin-bottom: 4px; text-shadow: 0 0 8px rgba(255,255,255,.2);
  }
  .sub.system { font-style: normal; color: var(--cyan); }

  .answer-box {                 /* pevné okno na 3 riadky; dlhší text sa počas písania posúva hore */
    height: 84px; overflow: hidden; position: relative;
    mask-image: linear-gradient(180deg, transparent 0, #000 10px, #000 100%);
    -webkit-mask-image: linear-gradient(180deg, transparent 0, #000 10px, #000 100%);
  }
  .answer {
    font-size: 20px; line-height: 1.4; color: var(--yellow);
    text-shadow: 0 0 12px rgba(252,238,10,.25);
    transition: color .3s, opacity 1.2s, filter 1.2s, transform 1.2s;
  }
  .answer.fade { opacity: 0; filter: blur(4px); transform: translateY(-6px); }   /* zmiznutie po odpovedi */
  .answer::after { content: "▌"; opacity: .8; animation: caret .9s step-start infinite; }
  .answer.done::after { content: ""; }
  .answer.cut { color: rgba(252,238,10,.55); }      /* prerušená odpoveď (barge-in) zostane, len zbledne */
  @keyframes caret { 50% { opacity: 0; } }

  /* hlavicka: pocitadlo smrti a hviezdy policie */
  .stats { display: inline-flex; gap: 12px; margin-left: auto; margin-right: 6px;
    font-family: 'Rajdhani', sans-serif; font-weight: 700; font-size: 13px; letter-spacing: 2px; }
  .stats:empty { display: none; }
  .stats .deaths { color: rgba(255,255,255,.55); }
  .stats .wanted { color: var(--red); text-shadow: 0 0 8px rgba(255,0,60,.7); animation: wantedBlink 1s steps(1) infinite; }
  @keyframes wantedBlink { 50% { color: #fff; text-shadow: 0 0 8px rgba(255,255,255,.6); } }

  /* banner pri udalosti z hry (level, quest, smrt, policia) — prekryje na chvilu telemetriu */
  .alert {
    position: absolute; top: 10px; right: 30px; z-index: 3;
    font-family: 'Rajdhani', sans-serif; font-weight: 700; font-size: 22px; letter-spacing: 4px;
    color: var(--fx, var(--yellow)); text-shadow: 0 0 14px var(--fx, var(--yellow));
    opacity: 0; pointer-events: none; white-space: nowrap;
  }
  .alert.show { animation: alertIn 3.6s ease-out forwards; }
  @keyframes alertIn {
    0%   { opacity: 0; transform: translateX(14px); clip-path: inset(0 0 60% 0); }
    6%   { opacity: 1; transform: translateX(-3px); clip-path: inset(40% 0 0 0); }
    10%  { opacity: 1; transform: none; clip-path: none; }
    85%  { opacity: 1; }
    100% { opacity: 0; transform: translateY(-4px); }
  }
  .panel.alerting .telemetry { opacity: 0; }

  /* pristup do databazy (wiki) — v riadku "sub" */
  .db { display: inline-flex; align-items: center; gap: 10px; color: var(--cyan); font-style: normal;
    text-shadow: 0 0 10px rgba(0,240,255,.55); letter-spacing: 1.5px; }
  .db .bar { position: relative; width: 120px; height: 3px; background: rgba(0,240,255,.15); overflow: hidden; }
  .db .bar::after { content: ""; position: absolute; top: 0; left: -40%; width: 40%; height: 100%;
    background: var(--cyan); box-shadow: 0 0 8px var(--cyan); animation: scan .7s linear infinite; }
  .db.found .bar::after { left: 0; width: 100%; animation: none; }
  .db .hex { opacity: .55; font-size: 12px; }
  @keyframes scan { to { left: 100%; } }

  /* kriticke HP: cerveny tep okraja; smrt: zablesk */
  .panel.critical { --accent: var(--red); animation: critPulse 1s ease-in-out infinite; }
  @keyframes critPulse { 50% { box-shadow: inset 0 0 26px rgba(255,0,60,.55); } }
  .panel.flatline { animation: flatline 1.4s steps(6); }
  @keyframes flatline {
    0%   { filter: none; }
    15%  { filter: saturate(3) hue-rotate(-30deg) brightness(1.6); transform: var(--base) translateX(-6px); }
    30%  { filter: grayscale(1) brightness(.5); transform: var(--base) translateX(5px); }
    60%  { filter: saturate(2) brightness(1.3); transform: var(--base); }
    100% { filter: none; transform: var(--base); }
  }

  /* sken obrazovky: ciara prejde cez panel */
  .sweep { position: absolute; top: 0; bottom: 0; left: 0; width: 2px; z-index: 2; pointer-events: none; opacity: 0;
    background: var(--cyan); box-shadow: 0 0 18px 4px rgba(0,240,255,.6); }
  .sweep.run { animation: sweep 1.1s ease-in-out 2; }
  @keyframes sweep { 0% { left: 0; opacity: .9; } 100% { left: 100%; opacity: .9; } }

  .glitch { animation: glitchIn .18s steps(2); }
  @keyframes glitchIn {
    0%   { transform: translateX(-3px); opacity: .2; clip-path: inset(10% 0 50% 0); }
    50%  { transform: translateX(3px);  opacity: .7; clip-path: inset(55% 0 5% 0); }
    100% { transform: none; opacity: 1; clip-path: none; }
  }
  .panel.pglitch { animation: panelGlitch .22s steps(3); }
  @keyframes panelGlitch {
    0%   { transform: var(--base); filter: none; }
    40%  { transform: var(--base) translate(-3px, -1px); filter: hue-rotate(10deg) brightness(1.2); }
    100% { transform: var(--base); filter: none; }
  }
</style>
<script>if (!window.obsstudio) document.documentElement.classList.add('preview');</script>
<script>
  // Zdroj aspoň 3x širší ako vysoký = režim fit: panel (980x150) sa zmenší/zväčší na celý zdroj.
  function fitHud() {
    const w = window.innerWidth, h = window.innerHeight, root = document.documentElement;
    const fit = w / h >= 3;
    root.classList.toggle('fit', fit);
    if (fit) root.style.setProperty('--fit', Math.min((w - 6) / 980, (h - 6) / 150).toFixed(4));
  }
  window.addEventListener('resize', fitHud);
  document.addEventListener('DOMContentLoaded', fitHud);
</script>
</head>
<body>

<div class="hud">
  <div class="panel offline" id="panel">
    <canvas id="core" width="300" height="300"></canvas>
    <div class="alert" id="alert"></div>
    <div class="sweep" id="sweep"></div>
    <div class="text">
      <div class="head">
        <div class="status"><span class="dot"></span><span id="status-label">MIRANA · OFFLINE</span></div>
        <div class="stats" id="stats"></div>
        <div class="telemetry" id="telemetry"></div>
      </div>
      <div class="sub" id="sub"></div>
      <div class="answer-box" id="answer-box"><div class="answer done" id="answer"></div></div>
    </div>
  </div>
</div>

<script>
/* ==========================================================
   Eventy z outputs/overlay.py (JSON cez WebSocket na tom istom porte):
     state {state}                     idle | listening | processing | speaking
     level {v}                         0..1, ~20x/s: hlas Mirany (speaking/filler) alebo mikrofón (listening)
     filler {text}                     hláška do riadku "sub"
     answer_start / answer_append {text, ms_per_char}   odpoveď po vetách (streaming)
     question {text}                   [SYSTÉM] hlášky do "sub" (Erikove otázky sa neposielajú)
     telemetry {location, quest, combat, wanted, critical, deaths}
     search {title}                    pristup do databazy (null = hlada, inak nazov clanku)
     game_fx {kind, text}              banner pri leveli, queste, smrti, policii
     queue {n}                         nepoužíva sa
   ========================================================== */
const el = (id) => document.getElementById(id);
const panel = el('panel'), statusLabel = el('status-label');

const LABELS = {
  idle: 'MIRANA · STANDBY', listening: 'MIRANA · POČÚVAM',
  processing: 'MIRANA · SPRACOVÁVAM', speaking: 'MIRANA · HOVORÍ', offline: 'MIRANA · OFFLINE',
  muted: 'MIRANA · STLMENÁ',
};
const COLORS = {
  idle: [252,238,10], listening: [0,240,255], processing: [252,238,10],
  speaking: [252,238,10], offline: [160,160,160], muted: [255,0,60], combat: [255,0,60],
};

let state = 'offline', combat = false, critical = false, deaths = 0, wanted = 0;
let fadeTimer = null;
const FADE_AFTER_MS = 5000;   // odpoveď zmizne 5 s po tom, čo Mirana dohovorí

/* Odpoveď prichádza po vetách (streaming). full = všetok doteraz prijatý text, shown = koľko
   znakov je vypísaných; jedna rAF slučka dopisuje v tempe poslednej vety (z dĺžky jej audia). */
let full = '', shown = 0, rate = 26, lastT = 0, running = false;

function scheduleFade() {
  clearTimeout(fadeTimer);
  fadeTimer = setTimeout(() => {
    const a = el('answer'); a.classList.add('fade');
    setTimeout(() => { if (a.classList.contains('fade')) { a.textContent = ''; a.className = 'answer done'; full = ''; shown = 0; } }, 1300);
  }, FADE_AFTER_MS);
}

function setState(s) {
  const prev = state; state = s;
  const keep = ['alerting', 'flatline'].filter(c => panel.classList.contains(c));
  panel.className = ['panel', s, combat ? 'combat' : '', critical ? 'critical' : '', ...keep].filter(Boolean).join(' ');
  statusLabel.textContent = LABELS[s] || s;
  if (s !== 'speaking' && prev === 'speaking') {
    if (s === 'idle') finishTyping();            // dohovorila — text sa dopíše celý, nikdy sa neutne
    else cutTyping();                            // barge-in: prerušená veta ostane, zbledne
    scheduleFade();
  }
  if (s === 'listening' || s === 'idle') { stopSearch(); el('sub').textContent = ''; el('sub').className = 'sub'; }
  if (prev !== s) { panel.classList.add('pglitch'); setTimeout(() => panel.classList.remove('pglitch'), 240); }
}
function showSub(text, system) {
  const q = el('sub');
  q.textContent = text; q.className = 'sub' + (system ? ' system' : '');
  q.classList.remove('glitch'); void q.offsetWidth; q.classList.add('glitch');
}
function answerStart() {
  clearTimeout(fadeTimer);
  stopSearch();
  full = ''; shown = 0;
  const a = el('answer'); a.className = 'answer'; a.textContent = '';
  el('answer-box').scrollTop = 0;
  el('sub').textContent = '';
}
function answerAppend(text, msPerChar) {
  clearTimeout(fadeTimer);
  full += (full ? ' ' : '') + text;
  rate = msPerChar || 26;
  el('answer').classList.remove('done', 'fade');
  if (!running) { running = true; lastT = performance.now(); requestAnimationFrame(typeStep); }
}
/* Písanie riadené časom (nie setTimeout krokom) — inak sa nazbiera oneskorenie. */
function typeStep(now) {
  const a = el('answer'), box = el('answer-box');
  shown = Math.min(full.length, shown + (now - lastT) / rate);
  lastT = now;
  const n = Math.floor(shown);
  if (a.textContent.length !== n) { a.textContent = full.slice(0, n); box.scrollTop = box.scrollHeight; }
  if (n < full.length) requestAnimationFrame(typeStep);
  else running = false;
}
function finishTyping() {
  shown = full.length;
  const a = el('answer');
  a.textContent = full; a.classList.add('done');
  el('answer-box').scrollTop = el('answer-box').scrollHeight;
}
function cutTyping() {
  full = full.slice(0, Math.floor(shown));
  el('answer').classList.add('done', 'cut');
}
function setTelemetry(t) {
  combat = !!t.combat; critical = !!t.critical;
  deaths = t.deaths || 0; wanted = t.wanted || 0;
  const tel = el('telemetry'); tel.textContent = '';
  if (t.location) { const b = document.createElement('b'); b.textContent = t.location; tel.appendChild(b); }
  if (t.quest) tel.appendChild(document.createTextNode(' · ' + t.quest));
  renderStats();
  setState(state);
}
function renderStats() {
  const st = el('stats'); st.textContent = '';
  if (wanted > 0) { const w = document.createElement('span'); w.className = 'wanted'; w.textContent = '★'.repeat(wanted); st.appendChild(w); }
  if (deaths > 0) { const d = document.createElement('span'); d.className = 'deaths'; d.textContent = '☠ ' + deaths; st.appendChild(d); }
}

/* ---------- efekty z hry ---------- */
const FX_COLORS = { level_up: 'var(--yellow)', quest_completed: 'var(--cyan)', death: 'var(--red)', wanted: 'var(--red)' };
let alertTimer = null;
function gameFx(kind, text) {
  const a = el('alert');
  a.style.setProperty('--fx', FX_COLORS[kind] || 'var(--yellow)');
  a.textContent = text;
  a.classList.remove('show'); void a.offsetWidth; a.classList.add('show');
  panel.classList.add('alerting');
  clearTimeout(alertTimer); alertTimer = setTimeout(() => panel.classList.remove('alerting'), 3600);
  if (kind === 'death') {
    panel.classList.remove('flatline'); void panel.offsetWidth; panel.classList.add('flatline');
    setTimeout(() => panel.classList.remove('flatline'), 1500);
    burst = 1;
  } else {
    panel.classList.add('pglitch'); setTimeout(() => panel.classList.remove('pglitch'), 240);
    burst = 0.7;
  }
}

/* ---------- sken obrazovky (Mirana sa pozera na snimku hry) ---------- */
function screenScan() {
  dbSearch(null, ['vizuálny sken', 'analyzujem obraz']);
  const sw = el('sweep'); sw.classList.remove('run'); void sw.offsetWidth; sw.classList.add('run');
}

/* ---------- pristup do databazy (wiki) ---------- */
let hexTimer = null, lineTimer = null;
function stopSearch() { clearInterval(hexTimer); clearInterval(lineTimer); }
function dbSearch(title, lines) {
  const q = el('sub');
  stopSearch();
  q.className = 'sub';
  q.textContent = '';
  const box = document.createElement('span'); box.className = 'db' + (title ? ' found' : '');
  const label = document.createElement('span');
  lines = (lines || []).filter(Boolean);
  const say = (t) => '◇ ' + t.toUpperCase();
  label.textContent = title ? '◇ DATABÁZA: ' + title : say(lines[0] || 'prístup do databázy');
  const bar = document.createElement('span'); bar.className = 'bar';
  const hex = document.createElement('span'); hex.className = 'hex';
  box.append(label, bar, hex); q.appendChild(box);
  if (!title && lines.length > 1) {            // dlhsie hladanie: kazde 2 s ina hlaska (bez hlasu)
    let i = 0;
    lineTimer = setInterval(() => {
      i = (i + 1) % lines.length; label.textContent = say(lines[i]);
      label.classList.remove('glitch'); void label.offsetWidth; label.classList.add('glitch');
    }, 2000);
  }
  if (!title) {
    hexTimer = setInterval(() => {
      hex.textContent = Array.from({ length: 4 }, () => Math.floor(Math.random() * 65536).toString(16).toUpperCase().padStart(4, '0')).join(' ');
    }, 90);
  } else {
    hex.textContent = 'OK';
  }
  q.classList.remove('glitch'); void q.offsetWidth; q.classList.add('glitch');
}

/* ---------- ŽIVÉ JADRO ---------------------------------------------------
   Vrstvy zvonka dovnútra: pomaly rotujúce segmentované prstence (rýchlosť
   podľa stavu), "thinking" oblúk pri processing, dýchajúce tenké kruhy a
   vnútorný obrys, ktorý deformuje skutočná hlasitosť (level) — hlas Mirany
   pri hovorení, mikrofón pri počúvaní. Všetko kreslené na canvas 2x DPI.
   ----------------------------------------------------------------------- */
const cv = el('core'), ctx = cv.getContext('2d');
const S = 300, C = S / 2;
let level = 0, target = 0, energy = 0;         // energy = pomaly doznievajúca hlasitosť
const N = 96, noise = Array.from({ length: N }, () => Math.random() * 6.28);
let rot = 0, t0 = performance.now(), burst = 0;

function lerpColor(a, b, k) { return a.map((v, i) => Math.round(v + (b[i] - v) * k)); }
let colorNow = COLORS.offline;

function draw(now) {
  const dt = Math.min(0.05, (now - t0) / 1000); t0 = now;
  const time = now / 1000;
  const want = (combat || critical) ? COLORS.combat : (COLORS[state] || COLORS.offline);
  colorNow = lerpColor(colorNow, want, 0.08);
  const [r, g, b] = colorNow;
  const rgba = (a) => `rgba(${r},${g},${b},${a})`;

  // hlasitosť: rýchly nábeh, pomalý dozvuk; v idle jemné "dýchanie"
  target = (state === 'speaking' || state === 'listening') ? target : 0;
  level += (target - level) * (target > level ? 0.55 : 0.18);
  energy = Math.max(level, energy - dt * 0.9);
  burst = Math.max(0, burst - dt * 1.2);
  if (critical) {                                   // srdcovy tep: dva udery za sekundu, potom pauza
    const ph = (time * 1.1) % 1;
    energy = Math.max(energy, ph < 0.1 ? 0.9 : ph < 0.2 ? 0.25 : ph < 0.3 ? 0.7 : 0);
  }
  energy = Math.max(energy, burst);
  const breath = 0.5 + 0.5 * Math.sin(time * (state === 'processing' ? 4 : 1.2));
  panel.style.setProperty('--breath', (0.25 + 0.35 * breath + 0.4 * energy).toFixed(2));

  ctx.clearRect(0, 0, S, S);
  ctx.lineCap = 'round';

  // vonkajší segmentovaný prstenec — rotuje (idle pomaly, processing rýchlo, speaking podľa energie)
  const speed = state === 'processing' ? 1.6 : state === 'speaking' ? 0.5 + energy : state === 'listening' ? 0.35 : 0.12;
  rot += dt * speed;
  ctx.strokeStyle = rgba(state === 'offline' ? .25 : .55); ctx.lineWidth = 2;
  for (let i = 0; i < 12; i++) {
    const a0 = rot + i * Math.PI / 6, gap = 0.16;
    ctx.beginPath(); ctx.arc(C, C, 128, a0 + gap, a0 + Math.PI / 6 - gap); ctx.stroke();
  }
  // druhý prstenec opačným smerom, jemnejší
  ctx.strokeStyle = rgba(.28); ctx.lineWidth = 1;
  for (let i = 0; i < 24; i++) {
    const a0 = -rot * 0.6 + i * Math.PI / 12;
    ctx.beginPath(); ctx.arc(C, C, 116, a0 + 0.05, a0 + Math.PI / 12 - 0.08); ctx.stroke();
  }
  // "thinking" oblúk — len počas processing
  if (state === 'processing') {
    ctx.strokeStyle = rgba(.95); ctx.lineWidth = 3;
    ctx.shadowColor = rgba(.8); ctx.shadowBlur = 14;
    const a = time * 3.2;
    ctx.beginPath(); ctx.arc(C, C, 122, a, a + 1.1); ctx.stroke();
    ctx.beginPath(); ctx.arc(C, C, 122, a + Math.PI, a + Math.PI + 0.5); ctx.stroke();
    ctx.shadowBlur = 0;
  }
  // dýchajúce tenké kruhy
  for (let k = 0; k < 3; k++) {
    const rr = 62 + k * 14 + breath * 4 + energy * 10 * (k + 1) / 3;
    ctx.strokeStyle = rgba(0.10 + 0.08 * k + energy * 0.25); ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(C, C, rr, 0, 6.2832); ctx.stroke();
  }
  // vnútorný hlasový obrys — deformovaný hlasitosťou
  const base = 40 + breath * 2, amp = 4 + energy * 34;
  ctx.beginPath();
  for (let i = 0; i <= N; i++) {
    const ang = (i % N) / N * 6.2832;
    const n = Math.sin(noise[i % N] + time * 9 + i * 0.7) * 0.5 + Math.sin(time * 5.3 + i * 1.9) * 0.5;
    const rad = base + amp * (0.35 + 0.65 * Math.abs(n)) * (state === 'speaking' || state === 'listening' ? 1 : 0.25);
    const x = C + Math.cos(ang) * rad, y = C + Math.sin(ang) * rad;
    i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  }
  ctx.closePath();
  ctx.shadowColor = rgba(.9); ctx.shadowBlur = 10 + energy * 28;
  ctx.strokeStyle = rgba(.9); ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = rgba(0.06 + energy * 0.22); ctx.fill();
  ctx.shadowBlur = 0;
  // jadro
  const glow = ctx.createRadialGradient(C, C, 0, C, C, 30);
  glow.addColorStop(0, rgba(0.85 * (0.5 + 0.5 * breath) + energy * 0.15));
  glow.addColorStop(1, rgba(0));
  ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(C, C, 30, 0, 6.2832); ctx.fill();

  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);

/* zriedkavý glitch panelu */
(function randomGlitch() {
  setTimeout(() => {
    panel.classList.add('pglitch'); setTimeout(() => panel.classList.remove('pglitch'), 240); randomGlitch();
  }, 18000 + Math.random() * 12000);
})();

function handle(ev) {
  switch (ev.type) {
    case 'state':     setState(ev.state); break;
    case 'level':     target = ev.v; break;
    case 'filler':    showSub('· ' + ev.text + ' ·', false); break;
    case 'answer_start':  answerStart(); break;
    case 'answer_append': answerAppend(ev.text, ev.ms_per_char); break;
    case 'question':  showSub(ev.text, true); break;
    case 'telemetry': setTelemetry(ev); break;
    case 'search':    dbSearch(ev.title, ev.lines); break;
    case 'scan':      screenScan(); break;
    case 'game_fx':   gameFx(ev.kind, ev.text); break;
  }
}

(function connect() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  const ws = new WebSocket(proto + '://' + location.host + '/ws');
  ws.onopen = () => { if (state === 'offline') setState('idle'); };
  ws.onmessage = (m) => { try { handle(JSON.parse(m.data)); } catch (e) { console.error(e); } };
  ws.onclose = () => { setState('offline'); setTimeout(connect, 2000); };
  ws.onerror = () => ws.close();
})();
</script>
