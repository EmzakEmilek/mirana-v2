<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<title>MIRANA HUD — diegetic v3</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #0a0a0c; /* V OBS: transparent */
    font-family: 'Share Tech Mono', monospace;
    overflow: hidden;
  }
  :root {
    --yellow: #FCEE0A;
    --cyan: #00F0FF;
    --red: #FF003C;
    --panel-bg: rgba(8,10,9,0.82);
    --panel-border: rgba(252,238,10,0.35);
  }

  .hud { position: relative; width: 100%; height: 100vh; }

  /* ==================================================================
     DIEGETICKÝ PANEL — základná stavebná jednotka, podľa referencie:
     tenký farebný okraj, uťatý roh (clip-path), tmavé poloprie hľadné
     pozadie, drobný "ornament" štítok v rohu. Žiadne scanlines/vinety —
     hra má vlastnú chromatickú aberáciu, netreba ju duplikovať.
     ================================================================== */
  .panel {
    position: absolute;
    background: var(--panel-bg);
    border: 1px solid var(--panel-border);
    clip-path: polygon(0 0, calc(100% - 14px) 0, 100% 14px, 100% 100%, 14px 100%, 0 calc(100% - 14px));
  }
  .panel::before {
    /* rohový "ornament" štítok — malý plný trojuholník v rezanom rohu */
    content: ""; position: absolute; top: 0; right: 0;
    width: 14px; height: 14px;
    background: var(--panel-accent, var(--yellow));
    clip-path: polygon(100% 0, 0 0, 100% 100%);
    opacity: .9;
  }
  .panel-label {
    font-family: 'Rajdhani', sans-serif; font-weight: 600;
    font-size: 10px; letter-spacing: 2.5px; text-transform: uppercase;
    color: var(--panel-accent, var(--yellow)); opacity: .85;
  }

  /* ==================================================================
     TELEMETRIA — pravý dolný roh (over v hre proti natívnemu ammo
     HUD-u; ak koliduje, presunúť na left:14px pod chat).
     ================================================================== */
  .telemetry {
    right: 18px; bottom: 18px; width: 236px;
    padding: 10px 14px 12px;
    --panel-accent: var(--cyan);
  }
  .telemetry .panel-label { margin-bottom: 6px; }
  .t-row {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 12px; color: rgba(255,255,255,.82); letter-spacing: .5px;
    padding: 2px 0;
  }
  .t-row b { color: var(--cyan); font-weight: normal; }
  .hpbar { height: 4px; margin: 5px 0 7px; background: rgba(255,255,255,.08); position: relative; }
  .hpfill { height: 100%; background: var(--yellow); width: 100%; transition: width .5s, background .3s; }
  .hpfill.low { background: var(--red); animation: pulse .6s infinite; }
  @keyframes pulse { 50% { opacity: .35; } }
  .combat-tag {
    display: inline-block; margin-top: 4px; font-size: 10px;
    letter-spacing: 2px; color: var(--red); opacity: 0;
  }
  .combat-tag.on { opacity: 1; animation: pulse .5s infinite; }

  /* ==================================================================
     HLAVNÝ PANEL — otázka + odpoveď + stavový tag v jednom, dole na
     stred. Nahrádza samostatný stavový indikátor (hore už nie je
     miesto — obsadené webcamom a donation barom).
     ================================================================== */
  .voice-panel {
    left: 50%; bottom: 20px; transform: translateX(-50%);
    width: min(74vw, 920px);
    padding: 14px 26px 16px;
    --panel-accent: var(--yellow);
    text-align: left;
  }
  .voice-head {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 6px;
  }
  .status-tag {
    display: inline-flex; align-items: center; gap: 6px;
    font-family: 'Rajdhani', sans-serif; font-weight: 600;
    font-size: 11px; letter-spacing: 2px; text-transform: uppercase;
    color: rgba(255,255,255,.4); transition: color .25s;
  }
  .status-dot { width: 6px; height: 6px; border-radius: 1px; background: currentColor; }
  .status-tag.listening  { color: var(--cyan); }
  .status-tag.processing { color: var(--yellow); }
  .status-tag.processing .status-dot { animation: blink .5s steps(1) infinite; }
  .status-tag.speaking   { color: var(--yellow); }
  .status-tag.speaking .status-dot { animation: pulse .4s infinite; }
  @keyframes blink { 50% { opacity: .15; } }

  .queue-tag { font-size: 11px; color: var(--cyan); opacity: .8; letter-spacing: 1px; }

  .question {
    font-size: 13px; color: rgba(255,255,255,.5); margin-bottom: 6px;
    min-height: 16px; letter-spacing: .3px;
  }
  .answer {
    font-family: 'Share Tech Mono', monospace;
    font-size: 22px; color: var(--yellow); line-height: 1.42;
    min-height: 32px;
  }
  .answer::after { content: "▌"; opacity: .8; animation: blink2 0.9s step-start infinite; }
  .answer.done::after { content: ""; }
  @keyframes blink2 { 50% { opacity: 0; } }

  .glitch { animation: glitchIn .16s steps(2); }
  @keyframes glitchIn {
    0% { transform: translateX(-2px); opacity: .3; clip-path: inset(15% 0 45% 0); }
    50% { transform: translateX(2px); opacity: .75; clip-path: inset(55% 0 5% 0); }
    100% { transform: none; opacity: 1; clip-path: none; }
  }

  /* jemný "systémový" glitch na celom hlavnom paneli, zriedkavý */
  .voice-panel.pglitch { animation: panelGlitch .22s steps(3); }
  @keyframes panelGlitch {
    0% { transform: translateX(-50%) translateY(0); filter: none; }
    40% { transform: translateX(calc(-50% - 3px)) translateY(-1px); filter: hue-rotate(8deg); }
    100% { transform: translateX(-50%) translateY(0); filter: none; }
  }
</style>
</head>
<body>

<div class="hud" id="hud">

  <!-- TELEMETRIA — pravý dolný roh -->
  <div class="panel telemetry" id="telemetry">
    <div class="panel-label">BIOMON // NCPD LINK</div>
    <div class="t-row"><span>HP</span><b id="t-hp">—</b></div>
    <div class="hpbar"><div class="hpfill" id="hpfill"></div></div>
    <div class="t-row"><span>LOKÁCIA</span><b id="t-loc">—</b></div>
    <div class="t-row"><span>QUEST</span><b id="t-quest">—</b></div>
    <div class="combat-tag" id="combat-tag">⚠ COMBAT ENGAGED</div>
  </div>

  <!-- HLAVNÝ HLASOVÝ PANEL — dole na stred -->
  <div class="panel voice-panel" id="voice-panel">
    <div class="voice-head">
      <div class="status-tag idle" id="status-tag">
        <span class="status-dot"></span><span id="status-label">MIRANA · STANDBY</span>
      </div>
      <div class="queue-tag" id="queue-tag"></div>
    </div>
    <div class="question" id="question"></div>
    <div class="answer done" id="answer"></div>
  </div>

</div>

<script>
/* ==========================================================
   DEMO REŽIM. Claude Code vo Fáze 3 nahradí demoLoop() reálnym
   WebSocket pripojením — kontrakt eventov (state_change, user_text,
   elena_text_chunk, telemetry, queue) ostáva rovnaký ako v SPEC.md,
   len cieľové DOM uzly sa zmenili (status-tag namiesto samostatného
   corner-indikátora, telemetry presunutá vpravo dole).
   ========================================================== */

const el = (id) => document.getElementById(id);
const statusTag = el('status-tag'), statusLabel = el('status-label');
const voicePanel = el('voice-panel');

const LABELS = {
  idle: 'MIRANA · STANDBY',
  listening: 'MIRANA · POČÚVAM',
  processing: 'MIRANA · SPRACOVÁVAM',
  speaking: 'MIRANA · HOVORÍ'
};

function setState(s) {
  statusTag.className = 'status-tag ' + s;
  statusLabel.textContent = LABELS[s] || s;
}
function setQueue(n) { el('queue-tag').textContent = n > 0 ? `FRONTA · ${n}` : ''; }
function setTelemetry(t) {
  el('t-hp').textContent = t.hp + '%';
  el('t-loc').textContent = t.location;
  el('t-quest').textContent = t.quest;
  const fill = el('hpfill');
  fill.style.width = t.hp + '%';
  fill.className = 'hpfill' + (t.hp <= 25 ? ' low' : '');
  el('combat-tag').className = 'combat-tag' + (t.combat ? ' on' : '');
}
function showQuestion(text) {
  const q = el('question');
  q.textContent = text; q.classList.remove('glitch'); void q.offsetWidth; q.classList.add('glitch');
}
let buffer = '';
function typeAnswer(fullText, msPerChar) {
  const a = el('answer'); a.classList.remove('done'); a.textContent = '';
  let i = 0;
  (function step() {
    if (i <= fullText.length) { a.textContent = fullText.slice(0, i); i++; setTimeout(step, msPerChar); }
    else a.classList.add('done');
  })();
}
function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

/* zriedkavý systémový glitch na hlavnom paneli */
(function randomGlitch() {
  setTimeout(() => {
    voicePanel.classList.add('pglitch');
    setTimeout(() => voicePanel.classList.remove('pglitch'), 240);
    randomGlitch();
  }, 15000 + Math.random() * 10000);
})();

const demo = [
  { q: 'Mirana, aký build mi odporúčaš na netrunnera?',
    a: 'Intelligence na max, Cyberdeck s Overclock, a nauč sa Contagion skôr než ťa niekto rozoberie na súčiastky.',
    t: { hp: 87, location: 'Watson / Kabuki', quest: 'Ghost Town', combat: false } },
  { q: '[SYSTÉM] pokles HP',
    a: 'HP pätnásť percent. Lekárnička, chum. Teraz.',
    t: { hp: 15, location: 'Watson / Kabuki', quest: 'Ghost Town', combat: true } },
  { q: 'Marek sa pýta: oplatí sa Phantom Liberty?',
    a: 'Marek, drahý, to je najlepší kus Night City za posledné roky. Choď do toho.',
    t: { hp: 92, location: 'Dogtown', quest: 'Firestarter', combat: false } },
];
let i = 0;
(async function demoLoop() {
  setTelemetry(demo[0].t);
  await sleep(2200);
  while (true) {
    const d = demo[i++ % demo.length];
    setState('listening'); showQuestion(d.q); setQueue(i % 3 === 0 ? 2 : 0);
    await sleep(1300);
    setState('processing'); await sleep(850);
    setState('speaking'); setTelemetry(d.t);
    typeAnswer(d.a, 26);
    await sleep(d.a.length * 26 + 1500);
    setState('idle'); await sleep(2400);
  }
})();
</script>
</body>
</html>
