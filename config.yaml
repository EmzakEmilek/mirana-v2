# MIRANA — konfigurácia
# Zmeny tu nevyžadujú zásah do kódu.

audio:
  # Presné názvy zisti cez: python -m sounddevice
  input_device: "Microphone (Trust GXT 232 Microphone), Windows WASAPI"   # null = predvolený mikrofón Windows
  # "názov, hostapi" = presný match; samotný názov by trafil aj MME variant, index sa mení po pripojení zariadenia
  output_device: "default"    # "default" = predvolený výstup Windows (teraz 24G1WG4 HDMI -> strihová karta -> stream)
  stream_output_device: null  # druhý výstup naraz (napr. slúchadlá + HDMI): "default" alebo názov; null = len jeden
  volume: 150                 # hlasitosť Mirany v % (posúvač v hlavnom okne), 0-150
  output_latency_ms: 100      # rezerva zvuku vo výstupe; HDMI má predvolene ~22 ms a pri záťaži hrou praská
  sample_rate: null           # null = natívna frekvencia mikrofónu (WASAPI iné neprijme)
  ptt_key: "mouse_x1"         # kláves ("f4") alebo tlačidlo myši: mouse_x1 = zadné bočné, mouse_x2 = predné bočné, mouse_middle
  panic_mute_key: "f11"       # to isté; okamžite stíši Miranu, druhé stlačenie ju vráti
  marker_key: "mouse_x2"      # ťuknutie = značka na strih (čas vo VOD-ke) do logs/strih-<dátum>.md

stt:
  provider: "local"           # "local" (faster-whisper na GPU) alebo "api" (Whisper API)
  api_model: "whisper-1"
  local_model: "medium"       # large-v3-turbo prekladal vety do anglictiny (test 2026-09-21); medium je pre SK spolahlivejsi
  local_device: "cuda"
  local_compute_type: "float16"
  language: "sk"
  # Slovník pre lokálny Whisper (initial_prompt): naladí ho na anglické názvy z CP2077, ktoré inak
  # prepisuje foneticky ("na SETI" = Night City, "čudy" = Judy). Whisper berie max 224 tokenov, dlhsi zoznam ticho oreze zlava — pri pridavani nieco vyhod.
  local_prompt_prefix: "Erik sa po slovensky pýta Mirany na Cyberpunk 2077:"   # slovensky kontext, aby Whisper neskocil do anglictiny
  local_vocabulary:
    - "Mirana"
    - "Emzo"
    - "Night City"
    - "Johnny Silverhand"
    - "Judy"
    - "Panam"
    - "Jackie"
    - "Kerry"
    - "River"
    - "Takemura"
    - "Hanako"
    - "Adam Smasher"
    - "Alt Cunningham"
    - "Rogue"
    - "Viktor"
    - "Misty"
    - "Delamain"
    - "Songbird"
    - "Aldecaldos"
    - "Voodoo Boys"
    - "Maelstrom"
    - "Tyger Claws"
    - "Valentinos"
    - "Arasaka"
    - "Militech"
    - "NetWatch"
    - "NCPD"
    - "Relic"
    - "Blackwall"
    - "Mikoshi"
    - "Soulkiller"
    - "Dogtown"
    - "Watson"
    - "Heywood"
    - "Pacifica"
    - "Badlands"
    - "Afterlife"
    - "Phantom Liberty"
    - "netrunner"
    - "quickhack"
    - "cyberdeck"
    - "cyberware"
    - "ripperdoc"
    - "Sandevistan"
    - "Kerenzikov"
    - "Mantis Blades"
    - "Monowire"
    - "Satori"
    - "Errata"
    - "Scalpel"
    - "iconic"
    - "eddies"
    - "gig"
    - "gigy"
    - "street cred"
    - "braindance"

llm:
  model: "claude-sonnet-5-5"  # s wiki stačí Sonnet 5.5 low (najrýchlejší, ~0,4 c/otázka); claude-opus-5-5 = lepšie lore, ~2x drahší
  max_tokens: 2000            # strop pre premýšľanie + odpoveď dokopy (modely 5.5 premýšľajú vždy); platí sa len skutočne použité
  effort: "low"               # low = najrýchlejší hlas; Sonnet 5.5 má predvolene high, Opus 5.5 medium (test 2026-10-03: bez premýšľania nebol rýchlejší)
  fallbacks: "default"        # ked bezpecnostny filter odmietne (falosny poplach), server otazku zopakuje na inom modeli; null = vypnute
  # Chat divakov ([CHAT_SUB], [CHAT_NESUB]) ide na lacnejsi model — kratke odpovede, nizsie stavky.
  chat_model: "claude-sonnet-5-5"   # pripravené pre Kick (fáza 5), teraz sa nepoužíva
  chat_effort: "low"
  cache_persona: true         # persona ako cacheable blok — zásadné pre rozpočet
  cache_memory: true          # aj pamäť rozhovoru ide do cache (breakpoint na novej otázke)

tts:
  voice: "sk-SK-ViktoriaNeural"   # rodená SK + phonetics.yaml; Emma (multilingválna) čítala fonetický prepis ako ruštinu
  rate: "+25%"                # rýchlosť reči, -30 % až +50 % (+10 % = asi o desatinu rýchlejšie)
  pitch: "+15%"
  sentence_pause_ms: 250      # pauza medzi vetami; Azure dáva za vetu ~840 ms ticha, zvyšok sa oreže
  phonetics_file: "phonetics.yaml"   # anglicizmy -> slovenská fonetika, len pre TTS (titulky ostávajú v origináli)
  effects:                    # efekty na hlas (outputs/voice_fx.py), platia aj pre fillery
    enabled: true
    preset: "robot"           # vypnute | jemny | night_city | robot
    params: {}                # jemné doladenie presetu, napr. {ring_mix: 0.08, echo_ms: 60}

memory:
  max_exchanges: 30           # pri prekročení sa pamäť oreže naraz na trim_to (nie po jednej) — kvôli prompt cache
  trim_to: 15                 # v pamäti je len otázka a odpoveď (bez [HRA] a [CHAT]), ~90 tokenov na výmenu

fillers:
  enabled: true
  speak: false                # false = filler sa len ukáže na HUD, nahlas ho nepovie
  skip_if_faster_than_ms: 1300      # pauza pred fillerom (~0.8 s STT + 0.5 s prirodzena prestavka); rychlejsia odpoved filler preskoci
  lines:
    - "sekundu, Emzo"
    - "premýšľam"
    - "momentík"
    - "daj mi chvíľku"
    - "overujem"
  search_lines:               # keď Mirana hľadá vo wiki — tieto hovorí nahlas (hľadanie trvá pár sekúnd)
    - "hľadám v databáze"
    - "moment, prehľadávam databázu"
    - "skúsim to dohľadať"
    - "pozriem sa do archívu"
    - "sekundu, ťahám to zo siete"
    - "preverujem v databáze"
    - "hneď to vyhrabem"

wiki:
  enabled: true               # Mirana si pri neistote pozrie Cyberpunk Fandom wiki (core/wiki.py), zadarmo, ~1 s + kolo modelu
  max_lookups: 2              # najviac toľko hľadaní na jednu otázku
  prefetch: true              # pri „kto je / čo je X“ priloží článok hneď k otázke (bez ďalšieho kola modelu, ~2-3 s rýchlejšie)
  timeout_sec: 5

idle_nudge:
  enabled: true               # keď sa Erik dlho neozve, Mirana sa vtipne pripomenie (môže siahnuť po stave hry)
  after_min: 10               # po koľkých minútach ticha
  max_in_row: 3               # najviac toľko za sebou bez Erikovej reakcie (potom je asi AFK a mlčí)

overlay:
  enabled: true
  host: "0.0.0.0"             # 0.0.0.0 kvôli prístupu z notebooku
  port: 8080
  typewriter_ms_per_char: 26  # zaloha; pri odpovedi sa tempo pocita z dlzky audia, aby text dobehol s hlasom

game_state:
  enabled: true               # bez bežiacej hry sa nič nedeje, Mirana funguje ďalej bez telemetrie
  json_path: "auto"           # auto = nájde hru (Steam/GOG/Epic) a číta state.json z CET modu mirana_state
  poll_interval_sec: 0.5      # mod zapisuje každú 1 s; čítanie len pri zmene súboru, takže nič nestojí
  stale_after_sec: 10         # starší stav = hra nebeží alebo je v menu, riadok [HRA] sa neposiela
  quiet_after_erik_sec: 30    # proaktívna hláška nepríde skôr ako 30 s po Erikovej otázke
  speak_on: ["hp_critical", "hp_low", "death", "level_up", "quest_changed", "quest_completed", "wanted_up"]   # ostatne udalosti len do logu; pocas sceny mlci
  hp_low_threshold: 25
  hp_critical_threshold: 10

kick_chat:
  enabled: false              # zapni vo Fáze 5
  channel_id: null
  command: "!mira"
  allowed_badges: ["subscriber", "moderator", "og", "founder", "broadcaster"]
  nesub_reply_every_n: 10     # kazdy N-ty nesub dostane predvolenu vetu len na HUD (bez API, bez hlasu)
  nesub_reply_text: "Prístup k palubnému počítaču majú subovia. Night City nič nedáva zadarmo."
  queue_max_size: 10
  cooldown_global_sec: 30
  cooldown_per_user_sec: 180
  voice_toggle: true          # "Mirana, chat off" / "chat on"
  mute_hp_below: 25           # fronta sa neberie pri nizkom HP, v combate a chvilu po Erikovej otazke
  mute_in_combat: true
  mute_after_erik_sec: 60

twitch_chat:
  enabled: true               # Mirana chat len číta (anonymne, bez bota, nič nepíše); komentuje ho, len keď sa Erik spýta
  channel: "emzakemil"        # názov kanála alebo odkaz twitch.tv/... (Nastavenia -> Chat)
  max_messages: 15            # koľko posledných správ ide k Erikovej otázke (riadok [CHAT])
  max_age_sec: 300            # staršie správy sa neposielajú
  max_chars: 150              # dlhšia správa sa oreže
  ignore_users: ["nightbot", "streamelements", "streamlabs", "moobot", "fossabot", "soundalerts"]   # boti

safety:
  enabled: true
  # Veta s týmto slovom (začiatok slova, bez diakritiky) sa nevysloví ani nevypíše — poistka pre Kick TOS.
  # E-maily, telefónne čísla, IP adresy a odkazy sa blokujú vždy (core/safety.py).
  blocked_words: ["negr", "nigger", "nigga", "cigos", "buzerant", "buzna", "faggot", "sieg heil"]

limits:
  daily_usd_cap: 5.00         # tvrdý denný strop na LLM (core/budget.py, stav v data/budget.json); po ňom Mirana povie budget_reached
  proactive_cooldown_sec: 300
  api_timeout_sec: 20
  tts_timeout_sec: 10         # Azure syntéza jednej vety; pri preteceni sa veta len vypise na HUD
  api_retries: 1               # retry robí SDK (429, 5xx, timeout)

fallback_phrases:
  stt_failed: "Nerozumela som ti, Emzo. Zopakuj to."
  llm_failed: "Spojenie s Netom vypadlo. Skús to o chvíľu."
  tts_failed: "Hlas mi vypadol, Emzo. Odpoveď máš na HUDe."
  budget_reached: "Dnešný rozpočet je vyčerpaný. Zajtra som späť."
  general_error: "Mám chybu v systéme. Pracujem na tom."

logging:
  level: "INFO"               # log kazdej session ide do logs/mirana-<cas>.log, rozhovor do logs/rozhovor-<cas>.jsonl
