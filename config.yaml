# MIRANA — konfigurácia
# Zmeny tu nevyžadujú zásah do kódu.

audio:
  # Presné názvy zisti cez: python -m sounddevice
  input_device: null          # druhý mikrofón na hernom PC
  output_device: "Voicemeeter Input (VB-Audio Voicemeeter VAIO)"  # WASAPI #57 / MME #20
  sample_rate: 16000
  ptt_key: "f12"
  panic_mute_key: "f11"

stt:
  provider: "api"             # "api" (Whisper API) alebo "local" (faster-whisper)
  api_model: "whisper-1"
  local_model: "medium"       # small | medium | large-v3 — medium je kompromis pre SK
  local_device: "cuda"
  local_compute_type: "float16"
  language: "sk"

llm:
  provider: "anthropic"
  model: "claude-sonnet-5"
  max_tokens: 300
  temperature: 0.9
  cache_persona: true         # persona ako cacheable blok — zásadné pre rozpočet

tts:
  provider: "azure"
  voice: "sk-SK-ViktoriaNeural"
  rate: "0%"
  pitch: "0%"

memory:
  max_exchanges: 8            # vyššie číslo = výrazne drahší input

fillers:
  enabled: true
  skip_if_faster_than_ms: 800
  lines:
    - "moment, chum"
    - "nechaj ma pozrieť"
    - "hmm"
    - "počkaj"
    - "idem na to"
    - "sekundu"
    - "už na tom robím"
    - "chvíľu"

overlay:
  enabled: true
  host: "0.0.0.0"             # 0.0.0.0 kvôli prístupu z notebooku
  port: 8080
  typewriter_ms_per_char: 26

game_state:
  enabled: false              # zapni vo Fáze 4
  json_path: "%TEMP%/mirana_state.json"
  poll_interval_sec: 2
  hp_low_threshold: 25
  hp_critical_threshold: 10

kick_chat:
  enabled: false              # zapni vo Fáze 5
  channel_id: null
  command: "!mira"
  allowed_badges: ["subscriber", "moderator", "og", "founder", "broadcaster"]
  nesub_reply_every_n: 10
  queue_max_size: 10
  cooldown_global_sec: 30
  cooldown_per_user_sec: 180

limits:
  daily_usd_cap: 1.00         # tvrdý strop, chráni pred bugom v slučke
  proactive_cooldown_sec: 300
  api_timeout_sec: 20
  api_retries: 1

fallback_phrases:
  stt_failed: "Nepočula som ťa poriadne, chum. Skús to znova."
  llm_failed: "Spojenie s netom je dnes v riti. Daj mi chvíľu."
  tts_failed: "Mám čo povedať, ale hlas mi vypadol. Pozri na titulky."
  budget_reached: "Na dnes som minula rozpočet, chum. Zajtra sme späť."
  general_error: "Niečo sa posralo na mojej strane. Idem na to."

logging:
  file: "mirana.log"
  level: "INFO"
